<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0509" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)" />

    <title>Requinte — Estúdio de Estética & Beleza</title>
    <meta
      name="description"
      content="Requinte — estúdio de estética premium. Design de sobrancelhas, micropigmentação, depilação, limpeza de pele e tatuagem. Agende a sua transformação."
    />
    <meta name="keywords" content="estética, sobrancelhas, micropigmentação, depilação, limpeza de pele, tatuagem, beleza, Requinte" />
    <meta name="author" content="Requinte" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Requinte — A arte de revelar a sua beleza" />
    <meta
      property="og:description"
      content="Estúdio de estética premium: sobrancelhas, micropigmentação, depilação, limpeza de pele e tatuagem. Cada detalhe pensado para a sua melhor versão."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap (avoid FOUC) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("requinte-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
